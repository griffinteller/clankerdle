[package]
name = "host-app"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
anyhow = "1.0.104"
chrono = "0.4.45"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres"] }
