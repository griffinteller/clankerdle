# fly.toml app configuration file generated for clankerdle-host-app on 2026-10-05T16:27:47-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clankerdle-host-app'
primary_region = 'ewr'

[build]
[env]
  INFERENCE_ENDPOINT = 'http://clankerdle-inference-app.flycast'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
